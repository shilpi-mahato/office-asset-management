spring.application.name=asset_management_system

# MySQL Configuration
# Reads DB_USERNAME / DB_PASSWORD from environment variables if they are set,
# otherwise uses the value after the colon. Replace the placeholder for local use.
spring.datasource.url=jdbc:mysql://localhost:3306/asset_db
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true